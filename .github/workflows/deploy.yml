name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio  # 👈 Keeps your subfolder setting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        # CHANGED: 'npm ci' -> 'npm install --legacy-peer-deps'
        # This tells npm to ignore the conflicting Babel versions shown in your error.
        run: npm install --legacy-peer-deps

      - name: Build React app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The deploy action doesn't use 'working-directory' automatically,
          # so we still need to specify the full path here.
          publish_dir: ./portfolio/build